苏州始终将农业摆在突出位置,农村改革发展一直是全国的研究样板...\"},{\"text\":\"全链赋能　产销畅通——河北衡水市冀州区农产品出村进城“加速跑”2026-05-26\",\"link\":\"/policies/2026-05-26-全链赋能-产销畅通-河北衡水市冀州区农产品出村进城-加速跑\",\"date\":\"2026-05-26\",\"source\":\"农业农村部市场与信息化司\",\"description\":\"农民日报全媒体记者　付雅\\n在冀州区现代农业融合创新基地,工作人员正在打理旋转滚筒。　受访者供图\\n清晨,河北省衡水市冀州区西午村的果蔬大棚里已是一片忙碌景象。工人们熟练地采摘、分拣、装筐,一颗颗带着天然果香的高品质蓝莓即将发往北京。这是冀州农产品“出村进城”供京津的日常。...\\n\"},{\"text\":\"山东青岛：田头冷链提速　破解流通堵点2026-05-26\",\"link\":\"/policies/2026-05-26-山东青岛-田头冷链提速-破解流通堵点\",\"date\":\"2026-05-26\",\"source\":\"农业农村部市场与信息化司\",\"description\":\"农民日报全媒体记者　郝凌峰\\n农产品出村进城,冷链物流是关键一环...\"},{\"text\":\"警惕农业品牌重创建轻维护2026-05-26\",\"link\":\"/policies/2026-05-26-警惕农业品牌重创建轻维护\",\"date\":\"2026-05-26\",\"source\":\"农业农村部市场与信息化司\",\"description\":\"孙莹\\n近年来，从地理标志农产品到区域公用品牌，从地方特产到小众好物，各地品牌农业建设如火如荼。一块响亮的牌子，不仅能让优质农产品实现优价，更能带动一方产业、富裕一方百姓。品牌“创起来”“亮起来”的背后，是政策扶持、资金投入与群众期盼...\"},{\"text\":\"一果“链”出500亿——湖北宜昌市柑橘品牌跃迁观察2026-05-26\",\"link\":\"/policies/2026-05-26-一果-链-出500亿-湖北宜昌市柑橘品牌跃迁观察\",\"date\":\"2026-05-26\",\"source\":\"农业农村部市场与信息化司\",\"description\":\"李伟　农民日报全媒体记者　乐明凯\\n宜昌柑橘的生产加工车间。　受访者供图\\n峡江两岸,橘林叠翠。作为农业农村部划定的长江上中游优势柑橘产业带重点区域,湖北省宜昌市坐拥“中国柑橘之乡”“中国脐橙之乡”的金字招牌,以一颗柑橘串起全产业链,绘就品牌强农、产业兴村的生动图景。\\n...\\n\"},{\"text\":\"浙江金华市：无人化配送织密农村寄递物流网2026-05-13\",\"link\":\"/policies/2026-05-13-浙江金华市-无人化配送织密农村寄递物流网\",\"date\":\"2026-05-13\",\"source\":\"农业农村部市场与信息化司\",\"description\":\"刘越\\n无人机吊运茶叶下山后,无人车“接力”运往茶叶工厂。　受访者供图\\n从穿越群山的“云端速递”到街头巷尾的“无人接驳”,一场由技术驱动的寄递变革正在浙江金华悄然发生...\"},{\"text\":\"区域公用品牌建设核心考验的是政绩观2026-05-13\",\"link\":\"/policies/2026-05-13-区域公用品牌建设核心考验的是政绩观\",\"date\":\"2026-05-13\",\"source\":\"农业农村部市场与信息化司\",\"description\":\"廖峰\\n农产品区域公用品牌建设中有一道深层考题:决定公用品牌能走多远的,往往不是资金、技术或资源禀赋,而是主政者的政绩观。这恰恰是农业品牌化进程中最容易被忽视、却又最为关键的变量。\\n一重考验:愿不愿干“聚光灯外”的苦活\\n区域公用品牌建设是长跑,成长期往往跨越多个任期...\"},{\"text\":\"直播成为新农活，数据变成新农资——新农人蹚出兴农路2026-05-13\",\"link\":\"/policies/2026-05-13-直播成为新农活-数据变成新农资-新农人蹚出兴农路\",\"date\":\"2026-05-13\",\"source\":\"农业农村部市场与信息化司\",\"description\":\"农民日报全媒体记者　张国凤\\n近年来,宁夏银川市金凤区从技术孵化、资金支持等全方位发力,培育了一批批乡村实用人才。如今 智慧农业-地方实践\",\"description\":\"牛奶智慧全产业链模式\\n浙江一鸣食品股份有限公司\\n一、基本情况\\n浙江一鸣食品股份有限公司\\n成立于1991年,\\n是一家集奶牛育种养殖、乳制品与烘焙食品加工、物流配送、连锁经营于一体的企业。\\n公司坚持以“奶牛”和“牛奶”探索“三产接二连一”融合发展路径...\"}]}],\"/standards/\":[{\"text\":\"技术标准\",\"collapsed\":false,\"items\":[{\"text\":\"关于征集2027年智慧农业国家和行业标准制修订项目立项建议的通知\",\"link\":\"/standards/2026-09-24-关于征集2027年智慧农业国家和行业标准制修订项目立项建议的通知\",\"date\":\"2026-09-24\",\"source\":\"农业农村部智慧农业-标准规范\",\"description\":\"各有关单位:\\n为进一步完善智慧农业标准体系,加快制定“人工智能+农业”标准,有力保障智慧农业高质量发展,按照《智慧农业标准体系建设指南》要求,现面向各单位征集2027年智慧农业领域国家标准和行业标准制修订项目立项建议。有关事项通知如下。\\n一、征集原则\\n...\\n\"},{\"text\":\"2026年农业信息化行业标准制修订交流活动成功举办\",\"link\":\"/standards/2026-06-26-2026年农业信息化行业标准制修订交流活动成功举办\",\"date\":\"2026-06-26\",\"source\":\"农业农村部智慧农业-标准规范\",\"description\":\"6月26日上午,农业农村部农业信息化标准化技术委员会\\n秘书处组织开展了\\n2026年标准制修订交流活动\\n,有关在研\\n标准承担单位首席专家及\\n骨干成员\\n60余人\\n参加...\"},{\"text\":\"关于公开征求《肉牛健康养殖数据采集技术要求（征求意见稿）...\",\"link\":\"/standards/2026-04-09-关于公开征求-肉牛健康养殖数据采集技术要求-征求意见稿\",\"date\":\"2026-04-09\",\"source\":\"农业农村部智慧农业-标准规范\",\"description\":\"根据农业行业标准制修订计划和标准起草有关规定,《肉牛健康养殖数据采集技术要求》已完成征求意见稿(附件1)及编制说明(附件2)的编写工作。现向社会公开征求意见。有关单位和公众可通过电子邮箱(xxzxyjgh@163.com)向农业农村部农业信息化标准化技术委员会秘书处提交反馈意见...\"},{\"text\":\"农业农村部农业信息化标准化技术委员会2025年度年会在北京召开\",\"link\":\"/standards/2026-01-28-农业农村部农业信息化标准化技术委员会2025年度年会在北京召开\",\"date\":\"2026-01-28\",\"source\":\"农业农村部智慧农业-标准规范\",\"description\":\"2026年1月27日,农业农村部农业信息化标准化技术委员会(以下简称“农信标委”)2025年度年会在京召开,市场与信息化司有关负责同志和农信标委全体委员参加会议...\"},{\"text\":\"关于公开征求《小麦供需平衡表编制规范（征求意见稿）》行业...\",\"link\":\"/standards/2026-01-13-关于公开征求-小麦供需平衡表编制规范-征求意见稿-行业\",\"date\":\"2026-01-13\",\"source\":\"农业农村部智慧农业-标准规范\",\"description\":\"根据农业行业标准制修订计划和标准起草有关规定,《小麦供需平衡表编制规范(征求意见稿)》已完成征求意见稿(附件1)及编制说明(附件2)的编写工作。现向社会公开征求意见。有关单位和公众可通过电子邮箱(xxzxyjgh@163.com)向农业农村部农业信息化标准化技术委员会秘书处提交反馈意见...\"},{\"text\":\"关于公开征求《农用北斗定位导航设备性能试验方法（征求意见...\",\"link\":\"/standards/2025-12-04-关于公开征求-农用北斗定位导航设备性能试验方法-征求意见\",\"date\":\"2025-12-04\",\"source\":\"农业农村部智慧农业-标准规范\",\"description\":\"根据农业行业标准制修订计划和标准起草有关规定,《农用北斗定位导航设备性能试验方法》已
